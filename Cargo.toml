[package]
name = "search-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
walkdir = "2.5.0"
anyhow = "1.0.103"
regex = "1.11.1"
rust-stemmers = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
